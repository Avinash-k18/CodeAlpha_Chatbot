<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ Assistant</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
  <header>
    <div><h1 id="title">Help Centre</h1><p>Answers to common questions, instantly.</p></div>
    <button id="reset" class="ghost" type="button">New chat</button>
  </header>
  <div id="chat" role="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <label for="msg" class="sr">Your question</label>
    <input id="msg" maxlength="500" placeholder="Type your question…" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script src="app.js"></script>
</body></html>
